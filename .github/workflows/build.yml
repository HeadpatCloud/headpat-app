name: Build App
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      build_mode:
        type: choice
        description: Where the build runs. Cloud uses EAS servers (pair with ubuntu-latest); local uses this runner (iOS needs macos-26)
        options:
          - cloud
          - local
      os:
        type: choice
        description: OS to build on. Ubuntu is faster, MacOS supports local iOS builds
        options:
          - ubuntu-latest
          - macos-26
          - macos-latest
      platform:
        type: choice
        description: Platform to build for
        options:
          - android
          - ios
      profile:
        type: choice
        description: Build profile to use
        options:
          - development
          - preview
          - production
      should_submit:
        type: boolean
        description: Submit to the store
        required: true
        default: true
jobs:
  build:
    runs-on: ${{ github.event.inputs.os }}
    strategy:
      matrix:
        node: [22.x]
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # eas-cli itself runs on Node, so it stays alongside Bun.
      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 🏗 Setup Java
        if: ${{ inputs.build_mode == 'local' && inputs.platform == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      # macos runners default to an Xcode whose iOS SDK predates Apple's
      # submission floor, so pin the newest one on the image explicitly.
      - name: 🏗 Select Xcode
        if: ${{ inputs.build_mode == 'local' && inputs.platform == 'ios' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔑 Pull environment variables
        run: |
          cp .env.example .env
          eas env:pull --non-interactive --environment ${{ inputs.profile }} --path .env

      - name: 🏷 Read app version
        id: version
        run: echo "value=$(npx expo config --json --type public | jq -r .version)" >> "$GITHUB_OUTPUT"

      - name: 👷 Build app on EAS
        if: ${{ inputs.build_mode == 'cloud' }}
        run: |
          eas build \
            --non-interactive \
            --platform=${{ inputs.platform }} \
            --profile=${{ inputs.profile }}

      - name: 👷 Build app on runner
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          mkdir -p app-build
          eas build --local \
            --non-interactive \
            --output=./app-build/${{ steps.version.outputs.value }}-headpat.${{ inputs.platform == 'ios' && 'ipa' || 'aab' }} \
            --platform=${{ inputs.platform }} \
            --profile=${{ inputs.profile }}

      - name: 📤 Upload build
        if: ${{ inputs.build_mode == 'local' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-build
          path: app-build

      - name: 🚢 Submit cloud build
        if: ${{ inputs.should_submit && inputs.profile == 'production' && inputs.build_mode == 'cloud' }}
        run: eas submit --non-interactive --latest -p ${{ inputs.platform }} --profile ${{ inputs.profile }}

      - name: 🚢 Submit runner build
        if: ${{ inputs.should_submit && inputs.profile == 'production' && inputs.build_mode == 'local' }}
        run: eas submit --non-interactive -p ${{ inputs.platform }} --profile ${{ inputs.profile }} --path app-build/${{ steps.version.outputs.value }}-headpat.${{ inputs.platform == 'ios' && 'ipa' || 'aab' }}
